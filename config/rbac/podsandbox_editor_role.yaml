# This rule is not used by the project cloud-api-adaptor-provider-kubernetes itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the sandbox.caa.mnicloud.jp.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cloud-api-adaptor-provider-kubernetes
    app.kubernetes.io/managed-by: kustomize
  name: podsandbox-editor-role
rules:
- apiGroups:
  - sandbox.caa.mnicloud.jp
  resources:
  - podsandboxes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sandbox.caa.mnicloud.jp
  resources:
  - podsandboxes/status
  verbs:
  - get
