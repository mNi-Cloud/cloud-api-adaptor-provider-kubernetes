apiVersion: v1
kind: Namespace
metadata:
  name: peer-pods-demo
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: peer-pods-demo
  labels:
    app: web
spec:
  runtimeClassName: kata-remote
  containers:
    - name: web
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["netexec", "--http-port=8080"]
      ports:
        - name: http
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /healthz
          port: http
      resources:
        requests:
          kata.peerpods.io/vm: "1"
        limits:
          kata.peerpods.io/vm: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: peer-pods-demo
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
