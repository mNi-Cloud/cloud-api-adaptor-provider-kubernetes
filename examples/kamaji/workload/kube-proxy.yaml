apiVersion: v1
kind: ServiceAccount
metadata:
  name: peer-pod-node-kube-proxy
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: peer-pod-node-proxier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:node-proxier
subjects:
  - kind: ServiceAccount
    name: peer-pod-node-kube-proxy
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: peer-pod-node-kube-proxy
  namespace: kube-system
data:
  config.conf: |-
    apiVersion: kubeproxy.config.k8s.io/v1alpha1
    kind: KubeProxyConfiguration
    clientConnection:
      kubeconfig: /var/lib/kube-proxy/kubeconfig.conf
    conntrack:
      maxPerCore: 0
      min: 0
    mode: iptables
  kubeconfig.conf: |-
    apiVersion: v1
    kind: Config
    clusters:
      - cluster:
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          server: https://peer-pods.peer-pods-example.svc:6443
        name: workload
    contexts:
      - context:
          cluster: workload
          user: kube-proxy
        name: workload
    current-context: workload
    users:
      - name: kube-proxy
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: peer-pod-node-kube-proxy
  namespace: kube-system
  labels:
    app: peer-pod-node-kube-proxy
spec:
  selector:
    matchLabels:
      app: peer-pod-node-kube-proxy
  template:
    metadata:
      labels:
        app: peer-pod-node-kube-proxy
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      serviceAccountName: peer-pod-node-kube-proxy
      nodeSelector:
        kubernetes.io/os: linux
        kata.peerpods.io/node: "true"
      tolerations:
        - key: kata.peerpods.io/node
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: kube-proxy
          image: registry.k8s.io/kube-proxy:v1.36.1
          command:
            - /usr/local/bin/kube-proxy
            - --config=/var/lib/kube-proxy/config.conf
            - --hostname-override=$(NODE_NAME)
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /var/lib/kube-proxy
            - name: xtables-lock
              mountPath: /run/xtables.lock
            - name: modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: peer-pod-node-kube-proxy
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
        - name: modules
          hostPath:
            path: /lib/modules
