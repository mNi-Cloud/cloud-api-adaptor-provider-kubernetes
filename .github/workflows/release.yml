name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: make test
      - name: Validate manifests
        run: |
          kubectl kustomize config/default >/dev/null
          kubectl kustomize config/dev >/dev/null

  build-and-push:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: controller
            dockerfile: Dockerfile
            platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - image: controller
            dockerfile: Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - image: runner
            dockerfile: Dockerfile.runner
            platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - image: runner
            dockerfile: Dockerfile.runner
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - image: caa
            dockerfile: Dockerfile.caa
            platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - image: caa
            dockerfile: Dockerfile.caa
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - image: peerpodctrl
            dockerfile: Dockerfile.peerpodctrl
            platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - image: peerpodctrl
            dockerfile: Dockerfile.peerpodctrl
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - image: podvm
            dockerfile: Dockerfile.podvm
            platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set image name
        id: image
        env:
          COMPONENT: ${{ matrix.image }}
        run: echo "name=${GITHUB_REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-images:
    name: Merge ${{ matrix.image }} image
    runs-on: ubuntu-24.04
    needs:
      - test
      - build-and-push
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [controller, runner, caa, peerpodctrl, podvm]
    steps:
      - name: Set image name
        id: image
        env:
          COMPONENT: ${{ matrix.image }}
        run: echo "name=${GITHUB_REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Create multi-platform manifest
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          source_args=()
          for digest in /tmp/digests/*; do
            source_args+=("$IMAGE_NAME@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create "${tag_args[@]}" "${source_args[@]}"
      - name: Inspect image
        env:
          VERSION_TAG: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.ref_name }}
        run: docker buildx imagetools inspect "$VERSION_TAG"

  release-manifests:
    name: Generate Release Manifests
    runs-on: ubuntu-24.04
    needs: merge-images
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      - name: Generate release assets
        run: make build-installer VERSION="${GITHUB_REF_NAME#v}"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/install.yaml
            dist/podsandboxclass.yaml
          generate_release_notes: true
